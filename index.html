<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-tile" content="Us">
  <link rel="apple-touch-icon" href="icon.png">
  <title> us · together for</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- drifting hearts (generated by JS) -->
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <main class="timer-wrap">
    <h1 class="timer-title">Together for and counting</h1>

    <div class="love-counter" id="loveCounter" aria-live="polite">
      <div class="counter-unit"><span id="counterYears">0</span><label>years</label></div>
      <div class="counter-unit"><span id="counterMonths">0</span><label>months</label></div>
      <div class="counter-unit"><span id="counterDays">0</span><label>days</label></div>
      <div class="counter-unit"><span id="counterHours">0</span><label>hours</label></div>
      <div class="counter-unit"><span id="counterMinutes">00</span><label>minutes</label></div>
      <div class="counter-unit"><span id="counterSeconds">00</span><label>seconds</label></div>
    </div>

    <p class="timer-footer"> every second, a little more us </p>
  </main>

  <script>
    const START_DATE = new Date(2025, 10, 2); // Nov 2, 2025, local midnight

    const el = {
      years:    document.getElementById('counterYears'),
      months:   document.getElementById('counterMonths'),
      days:     document.getElementById('counterDays'),
      hours:    document.getElementById('counterHours'),
      minutes:  document.getElementById('counterMinutes'),
      seconds:  document.getElementById('counterSeconds')
    };

    function getElapsed(start, now) {
      let years   = now.getFullYear() - start.getFullYear();
      let months  = now.getMonth()    - start.getMonth();
      let days    = now.getDate()     - start.getDate();
      let hours   = now.getHours()    - start.getHours();
      let minutes = now.getMinutes()  - start.getMinutes();
      let seconds = now.getSeconds()  - start.getSeconds();

      if (seconds < 0) { seconds += 60; minutes--; }
      if (minutes < 0) { minutes += 60; hours--;   }
      if (hours   < 0) { hours   += 24; days--;    }
      if (days    < 0) {
        const daysInPrevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += daysInPrevMonth;
        months--;
      }
      if (months  < 0) { months += 12; years--; }

      return { years, months, days, hours, minutes, seconds };
    }

    function tick() {
      const t = getElapsed(START_DATE, new Date());
      el.years.textContent   = t.years;
      el.months.textContent  = t.months;
      el.days.textContent    = t.days;
      el.hours.textContent   = t.hours;
      el.minutes.textContent = String(t.minutes).padStart(2, '0');
      el.seconds.textContent = String(t.seconds).padStart(2, '0');
    }

    tick();
    setInterval(tick, 1000);

    // ============================================================
    //  Drifting hearts in the background — purely decorative
    // ============================================================
    (function () {
      const container = document.getElementById('bgHearts');
      if (!container) return;

      const hearts = ['♡', '♡', '♥', '♡'];
      const total = 24;

      for (let i = 0; i < total; i++) {
        const s = document.createElement('span');
        s.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        s.style.left = Math.random() * 100 + '%';
        s.style.fontSize = (18 + Math.random() * 18) + 'px';
        s.style.animationDuration = (11 + Math.random() * 12) + 's';
        s.style.animationDelay = (Math.random() * 16) + 's';
        s.style.opacity = 0;
        container.appendChild(s);
      }
    })();
  </script>

</body>
</html>
